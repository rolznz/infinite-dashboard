# The app name comes from FLY_APP_NAME (pass -a "$FLY_APP_NAME").
primary_region = "fra"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

# SQLite, widgets and builds all live here, so the app runs as exactly one machine.
[mounts]
  source = "data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Builds run inside the server process, so it must never be stopped while idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # Every open dashboard holds an SSE connection.
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# Node + PI + headless Chromium for the pre-merge checks, with up to 2 builds in parallel.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
